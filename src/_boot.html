<style id="acBootCss">
/* (v83) the start: where the maker is from and where its work is going. A key visual in the game's own cel style — dawn over Mt Fuji and a Tokyo
   viaduct on the left, the sea in the seigaiha wave pattern, Taiwan's ranges, a temple roof and the high-speed line on the right; paper cranes fly
   the way across and sky lanterns rise to meet them; Luna waves from the Taiwan side. On the card the loading bar is that journey: it runs from
   “Tokyo, Japan” to “Taiwan” with her glider at its head. One wide dark button under it opens the technical data without waiting for the game.
   Original artwork. */
#acBoot{--ink:#2b2420;--cream:#fff8ec;--org:#ef7a1d;position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:flex-start;padding:20px 20px clamp(110px,27vh,260px) max(20px,6vw);box-sizing:border-box;overflow:hidden;background:#8fd0fb;color:var(--ink);font-family:"Noto Sans TC","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;opacity:1;transition:opacity .7s ease}
#acBoot.is-out{opacity:0;pointer-events:none}#acBoot[hidden]{display:none}#acBoot *{box-sizing:border-box}
.acb-kv{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block}
.acb-kv .acb-c2{animation:acbDrift 140s linear infinite alternate-reverse}.acb-kv .acb-c3{animation:acbDrift 60s linear infinite alternate}.acb-kv .acb-c1{animation:acbDrift 90s linear infinite alternate}

.acb-kv .acb-train{animation:acbTrain 12s linear infinite}

.acb-kv .acb-jr{animation:acbJr 17s linear infinite}

.acb-kv .acb-glint{animation:acbGlint 3.2s ease-in-out infinite}.acb-kv .acb-glint:nth-child(2n){animation-delay:-1.1s}.acb-kv .acb-glint:nth-child(3n){animation-delay:-2.2s}
@keyframes acbGlint{0%,100%{opacity:.15}50%{opacity:.95}}
.acb-kv .acb-lan{animation:acbLan 6.4s ease-in-out infinite alternate}.acb-kv .acb-lan:nth-child(2n){animation-duration:7.6s;animation-delay:-2.4s}.acb-kv .acb-lan:nth-child(3n){animation-duration:5.6s;animation-delay:-4s}
@keyframes acbLan{from{transform:translate(-3px,6px)}to{transform:translate(4px,-12px)}}
.acb-kv .acb-crane{animation:acbCrane 4.2s ease-in-out infinite alternate}.acb-kv .acb-crane:nth-child(2n){animation-delay:-1.6s}
@keyframes acbCrane{from{transform:translate(-4px,3px)}to{transform:translate(5px,-5px)}}

.acb-spark::before,.acb-spark::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:3px;margin:-1.5px 0 0 -50%;border-radius:3px;background:#fff;box-shadow:0 0 8px #fff}.acb-spark::after{transform:rotate(90deg)}
@keyframes acbTw{0%,100%{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}

/* the maker's mark on the card's edge (the page's own logo, set as soon as the first part of the code has brought it) */
.acb-logo{position:absolute;right:22px;top:-18px;display:flex;align-items:center;justify-content:center;min-width:54px;height:33px;padding:0 11px;border:3px solid var(--ink);border-radius:999px;background:var(--org);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.acb-logo img{display:none;height:19px;width:auto}.acb-logo.is-on img{display:block}
#acBoot .acb-ring{display:none}.acb-ring{position:relative;width:118px;height:118px;margin:0 0 30px}.acb-ring>div{position:absolute;inset:0;will-change:transform}.acb-ring svg{display:block;width:100%;height:100%;overflow:visible}.acb-arc{animation:acbSpin 1.3s linear infinite}.acb-dash{animation:acbSpin 9s linear infinite reverse}.acb-dot{animation:acbSpin 2.4s cubic-bezier(.45,.05,.55,.95) infinite}@keyframes acbSpin{to{transform:rotate(360deg)}}
.acb-kick{margin:0 0 6px;font-family:Oswald,Barlow,"Noto Sans TC",sans-serif;font-weight:800;font-size:12px;line-height:1.2;letter-spacing:.2em;color:#b54f0c;text-transform:uppercase}

/* the journey: where it starts, where it goes, and how far the loading has come */
.acb-route{position:relative;width:100%;margin:10px 0 0}

.acb-ends{display:flex;justify-content:space-between;align-items:center;width:100%;margin:6px 0 0;font-weight:800;font-size:12px;line-height:1.3;letter-spacing:.08em;color:var(--ink)}
.acb-ends span{display:inline-flex;align-items:center;gap:6px}.acb-ends i{flex:none;width:10px;height:10px;border:2.5px solid var(--ink);border-radius:50%;background:#fff}.acb-ends span+span i{background:var(--org)}
.acb-st{margin:9px 0 0;min-height:1.5em;font-weight:700;font-size:15px;line-height:1.5;color:var(--ink)}

.acb-tip{position:relative;margin:22px 0 0;width:100%;min-height:3.5em;padding:15px 16px 11px;border:3px solid var(--ink);border-radius:18px;background:#fff;font-weight:600;font-size:14.5px;line-height:1.6;color:var(--ink);transition:opacity .45s}

/* the technical data, without the game: the widest and darkest thing on the card after its name */
.acb-btn{position:relative;z-index:3;display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin:14px 0 0;padding:9px 14px 10px;border:3px solid var(--ink);border-radius:18px;background:var(--ink);color:#fff;font-family:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:0 5px 0 rgba(43,36,32,.36);transition:transform .12s,box-shadow .12s,background .12s}
.acb-btn svg{flex:none;width:28px;height:28px;fill:none;stroke:#ffb35a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.acb-btn svg.acb-chev{width:22px;height:22px;stroke:#fff;stroke-width:2.4}
.acb-btn>span{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
