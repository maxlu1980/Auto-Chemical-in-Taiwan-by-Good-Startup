<title>Auto Chemical in Taiwan by Good Startup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;700&family=Oswald:wght@500&family=Noto+Sans+TC:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap">
<style>
/* Auto Chemical identity — tokens from the Auto Chemical design system (tokens.json): one saturated orange, black, white and quiet greys;
   DIN-like Latin type, Japanese gothic for kana, square blocks, 4/6 px radii only on what a hand touches. The page structure and components
   follow the Schomburg application-guide design that this guide is modelled on. */
:root{
  --red:#f97b00;--red-hover:#d75100;--blue:#111111;--orange:#f97b00;--navy:#000000;--ice:#ffb673;--cyan:#1a8fd0;--black:#111111;
  --grey-70:#6d6d6d;--grey-50:#888888;--grey-40:#9a9a9a;--grey-35:#b7b7b7;--grey-20:#cccccc;--grey-10:#e5e5e5;--white:#ffffff;
  --surface:var(--white);--surface-panel:#f5f5f5;--surface-alt:#fafafa;--surface-photo:var(--grey-10);--surface-inverse:var(--navy);
  --ink:var(--black);--ink-muted:var(--grey-70);--on-red:var(--white);--on-blue:var(--white);--on-navy:var(--white);--on-photo:var(--white);
  --line:#b7b7b7;--line-strong:var(--black);--line-accent:var(--red);--focus:#d75100;--info:#004d8e;--error:#d60101;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --page-margin:76px;--column-gutter:13px;--content-max:1280px;
  --radius-none:0px;--radius-sm:4px;--radius-md:5px;--radius-lg:6px;--radius-pill:14px;--radius-full:50%;--border-hair:1px;--border-accent:3px;--border-bar:6px;--border-focus:2px;
  --font-latin:"Barlow","DIN 2014","Helvetica Neue",Arial,sans-serif;
  --font-cjk:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Kaku Gothic Pro","ヒラギノ角ゴ Pro W3",Meiryo,"メイリオ","Noto Sans JP",sans-serif;
  --font-sans:"Barlow","Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Kaku Gothic Pro",Meiryo,"Noto Sans JP","Helvetica Neue",Arial,sans-serif;
  --font-display:"Oswald","Barlow","Arial Narrow",sans-serif;
  --gutter:clamp(16px,5vw,76px);
  --header-h:64px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html[lang="ja"]{--font-sans:"Barlow","Noto Sans JP","Hiragino Kaku Gothic Pro","ヒラギノ角ゴ Pro W3",Meiryo,"メイリオ","Noto Sans TC","Helvetica Neue",Arial,sans-serif}
html[lang="en"]{--font-sans:"Barlow","Noto Sans TC","Noto Sans JP","Helvetica Neue",Arial,sans-serif}

[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 56px)}
body{margin:0;font-family:var(--font-sans);font-weight:300;font-size:16px;line-height:24px;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
html[lang="zh-Hant-TW"] body{line-height:26px}
img,svg{max-width:100%}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
b,strong{font-weight:700}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:var(--border-focus) solid var(--focus);outline-offset:2px}
.on-navy :focus-visible,.sim :focus-visible{outline-color:var(--white)}
.wrap{max-width:calc(var(--content-max) + 2 * var(--gutter));margin-inline:auto;padding-inline:var(--gutter)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ProductName — Bold family, Light suffix */
.sb-pname{font-weight:700;white-space:nowrap;letter-spacing:0}
.sb-pname__reg{font-weight:300;font-size:.58em;vertical-align:.62em;line-height:0;margin-left:.02em}
.sb-pname__suffix{font-weight:300}

/* Logo */
.sb-logo{display:inline-block;vertical-align:middle;flex:none}
.sb-logo--red{fill:var(--red)}.sb-logo--white{fill:var(--white)}.sb-logo--black{fill:var(--black)}

/* Buttons */
.sb-btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:44px;padding:0 var(--space-5);border:var(--border-hair) solid transparent;border-radius:0;font:700 16px/24px var(--font-sans);text-decoration:none;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.sb-btn--lg{min-height:52px;padding:0 var(--space-6);font-size:18px}
.sb-btn--primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.sb-btn--primary:hover{background:var(--red-hover);border-color:var(--red-hover)}
.sb-btn--secondary{background:transparent;border-color:var(--ink);color:var(--ink)}
.sb-btn--secondary:hover{background:var(--ink);color:var(--white)}
.sb-btn--inverse{background:var(--white);border-color:var(--white);color:var(--black)}
.sb-btn--inverse:hover{background:var(--ice);border-color:var(--ice)}
.sb-btn[disabled]{background:var(--grey-10);border-color:var(--grey-10);color:var(--grey-70);cursor:not-allowed}
.sb-btn--icon{padding:0;width:44px}
.sb-link{display:inline-flex;align-items:baseline;gap:var(--space-2);font:700 16px/24px var(--font-sans);color:var(--ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.sb-link::before{content:"";flex:none;width:0;height:0;border-style:solid;border-width:6px 0 6px 7px;border-color:transparent transparent transparent var(--red);transform:translateY(1px)}
.sb-link:hover{text-decoration:underline;text-underline-offset:3px}
.on-navy .sb-link,.sim__cardin .sb-link{color:var(--white)}

/* Lists */
.sb-list{font:300 16px/24px var(--font-sans);display:grid;gap:var(--space-1)}
html[lang="zh-Hant-TW"] .sb-list{line-height:26px}
.sb-list>li{position:relative;padding-left:var(--space-4)}
.sb-list>li::before{content:"•";position:absolute;left:0;top:0;color:var(--red-ink);font-weight:700}
.sb-list--ink>li::before{color:var(--ink)}
.sb-list--num{counter-reset:n}
.sb-list--num>li{padding-left:var(--space-5);counter-increment:n}
.sb-list--num>li::before{content:counter(n) ".";color:var(--ink);font-weight:700}

/* Tables — rules only */
.sb-table-wrap{overflow-x:auto}
.sb-table{width:100%;border-collapse:collapse;font:300 16px/24px var(--font-sans);font-variant-numeric:tabular-nums}
.sb-table caption{caption-side:top;text-align:left;font-weight:700;padding-bottom:var(--space-2)}
.sb-table th,.sb-table td{text-align:left;vertical-align:top;padding:var(--space-2) var(--space-3) var(--space-2) 0;border-bottom:var(--border-hair) solid var(--line)}
.sb-table thead th{font-weight:700;border-top:var(--border-accent) solid var(--line-accent);border-bottom:0;padding-top:var(--space-2)}
.sb-table tbody th{font-weight:400;width:38%}
.sb-table tbody tr:first-child th,.sb-table tbody tr:first-child td{border-top:var(--border-hair) solid var(--line)}
.sb-table__note{font:300 13px/16px var(--font-sans);margin-top:var(--space-2)}
.sb-table .num{text-align:right;padding-right:0}

/* Info panel */
.sb-panel{background:var(--surface-panel);padding:var(--space-4)}
.sb-panel__card{background:var(--surface);padding:var(--space-3) var(--space-4) var(--space-4)}
.sb-panel__title{font:700 16px/24px var(--font-sans);padding-bottom:var(--space-1);border-bottom:var(--border-hair) solid var(--line-strong)}
.sb-panel__body{margin-top:var(--space-3)}

/* ---------- Header ---------- */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:var(--border-hair) solid var(--grey-20)}
.util{background:var(--surface-panel);font:300 13px/16px var(--font-sans)}
.util .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2) var(--space-5);padding-block:var(--space-2)}
.util__dist{font-weight:400}
.util__links{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-5)}
.util a{text-decoration:none}.util a:hover{text-decoration:underline}
.lang{display:flex;gap:0;align-items:center}
.lang button{appearance:none;background:none;border:0;padding:6px 8px;min-height:28px;font:300 13px/16px var(--font-sans);color:var(--ink);cursor:pointer;border-bottom:2px solid transparent}
.lang button[aria-pressed="true"]{font-weight:700;border-bottom-color:var(--red)}
.lang button+button{margin-left:4px}
.mainbar .wrap{display:flex;align-items:center;gap:var(--space-4) var(--space-6);min-height:var(--header-h)}
.mainbar__logo{display:flex;align-items:center;flex:none}
.nav{display:flex;gap:var(--space-5);margin-right:auto;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:block;padding:var(--space-2) 0;font:400 15px/20px var(--font-sans);color:var(--ink);text-decoration:none;border-bottom:var(--border-accent) solid transparent;white-space:nowrap}
.nav a:hover,.nav a[aria-current="true"]{border-bottom-color:var(--red)}
.nav a[aria-current="true"]{font-weight:700}
.mainbar .sb-btn{min-height:40px;flex:none}
@media (max-width:640px){.util__links a{display:none}.util__dist{font-size:12px}}
@media (max-width:900px){
  .mainbar .wrap{flex-wrap:wrap;padding-block:var(--space-3);gap:var(--space-2) var(--space-4)}
  .nav{order:3;width:100%;margin-right:0}
  .mainbar .sb-btn{margin-left:auto}
  html{scroll-padding-top:150px}
}

/* ---------- Products drop-down: group ▸ subgroup ▸ products, as on autochem.co.jp ---------- */
.mainbar .wrap{position:relative}
.mainbar .wrap{gap:var(--space-4) var(--space-5)}
.nav{gap:20px}
@media (max-width:640px){#navCta{display:none}}
@media (max-width:480px){.mainbar__logo svg{height:22px;width:auto}}
.pmenu{flex:none}
.pmenu__btn{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:var(--space-2);min-height:44px;padding:0 2px;font:700 16px/24px var(--font-sans);color:var(--red-ink);cursor:pointer;border-bottom:var(--border-accent) solid transparent}
.pmenu__btn:hover,.pmenu.is-open .pmenu__btn{border-bottom-color:var(--red)}
.pmenu__btn svg{transition:transform .15s}
.pmenu.is-open .pmenu__btn svg{transform:rotate(180deg)}
.pmenu__panel{position:absolute;left:var(--gutter);right:var(--gutter);top:100%;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);background:var(--white);border:var(--border-hair) solid var(--grey-20);border-top:0;box-shadow:0 22px 44px rgba(35,31,32,.16);max-height:calc(100vh - 150px);overflow:auto}
.pmenu__col{min-width:0}
.pmenu__col+.pmenu__col{border-left:var(--border-hair) solid var(--grey-20)}
.pmenu__group{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin:var(--space-3) var(--space-4) 0;padding:var(--space-3) 0 var(--space-5);border-top:2px solid var(--tone,var(--grey-50));font:300 16px/22px var(--font-sans);text-transform:uppercase;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.pmenu__group[data-tone="blue"]{--tone:var(--blue)}.pmenu__group[data-tone="red"]{--tone:var(--red)}.pmenu__group[data-tone="orange"]{--tone:var(--orange)}.pmenu__group[data-tone="grey"]{--tone:var(--grey-50)}
.pmenu__group.is-active{color:var(--red-ink);font-weight:400}
.pmenu__group.is-active .pmenu__chev{color:var(--red-ink)}
a.pmenu__group{color:var(--ink-muted)}
a.pmenu__group:hover{color:var(--ink)}
.pmenu__ext,.pmenu__chev{flex:none}
.pmenu__cap{font:700 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding:var(--space-4) var(--space-4) var(--space-2)}
.pmenu__sub{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:52px;padding:var(--space-3) var(--space-4);border-bottom:var(--border-hair) solid var(--grey-20);font:300 16px/22px var(--font-sans);text-transform:uppercase;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.pmenu__sub:first-of-type{border-top:var(--border-hair) solid var(--grey-20)}
.pmenu__sub[aria-expanded="true"],.pmenu__sub:hover{color:var(--red-ink)}
.pmenu__sub[aria-current="page"]{font-weight:700}
.pmenu__sub--ext{font-size:13px;line-height:18px;color:var(--ink-muted);text-transform:none;border-bottom:0}
.pmenu__inline{display:none}
.pmenu__lead{display:block;padding:var(--space-4);background:var(--surface-panel);text-decoration:none;color:var(--ink);border-bottom:var(--border-hair) solid var(--grey-20)}
.pmenu__lead b{display:block;font:700 15px/20px var(--font-sans);color:var(--red-ink)}
.pmenu__lead b::after{content:" ›"}
.pmenu__lead span{display:block;font:300 13px/18px var(--font-sans);margin-top:2px}
.pmenu__lead:hover b{text-decoration:underline;text-underline-offset:3px}
.pmenu__product{display:block;padding:var(--space-3) var(--space-4) var(--space-4);border-bottom:var(--border-hair) solid var(--grey-20);text-decoration:none;color:var(--ink)}
.pmenu__product:last-child{border-bottom:0}
.pmenu__pname{display:block;font-size:16px;line-height:24px}
.pmenu__pname .sb-pname{font-weight:400}
.pmenu__product b{display:block;font:700 14px/19px var(--font-sans)}
.pmenu__product:hover{background:var(--surface-panel)}
.pmenu__product:hover .pmenu__pname{color:var(--red-ink)}
@media (max-width:900px){
  .pmenu{order:2;margin-left:auto}
  .pmenu__panel{left:0;right:0;grid-template-columns:1fr;max-height:calc(100vh - 120px)}
  .pmenu__col+.pmenu__col{border-left:0}
  .pmenu__col--groups{display:flex;flex-wrap:wrap;gap:0 var(--space-4);padding:0 var(--space-4);order:3;border-top:var(--border-hair) solid var(--grey-20)}
  .pmenu__group{margin:var(--space-3) 0 0;padding-bottom:var(--space-3);font-size:13px;line-height:18px;flex:1 1 40%}
  .pmenu__group.is-active{display:none}
  .pmenu__col--products{display:none}
  .pmenu__inline{display:block;background:var(--surface-panel)}
  .pmenu__inline[hidden]{display:none}
  .pmenu__sub .pmenu__chev{transform:rotate(90deg);transition:transform .15s}
  .pmenu__sub[aria-expanded="true"] .pmenu__chev{transform:rotate(-90deg)}
  .mainbar .sb-btn{order:2;margin-left:0}
}
/* breadcrumb with the quick switch between the two guides */
.crumbs{border-bottom:var(--border-hair) solid var(--grey-20);background:var(--white);font:300 13px/16px var(--font-sans)}
.crumbs .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2) var(--space-5);padding-block:var(--space-2)}
.crumbs__path{display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--space-2);min-width:0}
.crumbs__path li+li::before{content:"›";margin-right:var(--space-2);color:var(--ink-muted)}
.crumbs__path [aria-current]{font-weight:700}
.crumbs__btn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--red-ink);cursor:pointer;min-height:28px}
.crumbs__btn:hover{text-decoration:underline;text-underline-offset:3px}
.crumbs__switch{display:flex;gap:var(--space-4)}
.crumbs__switch a{display:block;padding:6px 0;color:var(--ink);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.crumbs__switch a[aria-current]{font-weight:700;border-bottom-color:var(--red)}
.crumbs__switch a:hover{border-bottom-color:var(--red)}
@media (max-width:640px){.crumbs__path li:nth-child(2){display:none}.crumbs__switch{gap:var(--space-3);overflow-x:auto;max-width:100%;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}.crumbs__switch::-webkit-scrollbar{display:none}.crumbs__switch a{scroll-snap-align:center}}

/* ---------- Cover / hero ---------- */
.cover{border-top:var(--border-bar) solid var(--blue)}
.cover__grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:var(--space-7);padding-block:var(--space-7) var(--space-7);align-items:start}
.cover__kicker{font:300 20px/24px var(--font-sans);margin-bottom:var(--space-8)}
.cover__title{font:700 clamp(36px,5.2vw,56px)/1.12 var(--font-sans)}
.cover__sub{font:300 clamp(30px,4.2vw,48px)/1.16 var(--font-sans);text-wrap:balance}
.cover__intro{font:300 18px/26px var(--font-sans);margin-top:var(--space-6);max-width:520px}
html[lang="zh-Hant-TW"] .cover__intro{line-height:28px}
.cover__claim{font:700 20px/24px var(--font-sans);margin-top:var(--space-4)}
.cover__actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4) var(--space-5);margin-top:var(--space-6)}
.cover__side{display:flex;flex-direction:column;gap:var(--space-5);align-items:flex-end}
.cover__photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface-photo)}
.cover__cap{font:400 13px/16px var(--font-sans);align-self:flex-start;margin-top:calc(-1 * var(--space-3))}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:var(--border-hair) solid var(--line-strong)}
.stat{padding:var(--space-4) var(--space-4) var(--space-6) 0}
.stat+.stat{padding-left:var(--space-4);border-left:var(--border-hair) solid var(--grey-20)}
.stat__pre{font:300 13px/16px var(--font-sans);display:block;min-height:16px}
.stat__num{font:700 32px/38px var(--font-sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat__num small{font:300 18px/26px var(--font-sans)}
.stat__label{font:300 16px/22px var(--font-sans);margin-top:var(--space-1)}
@media (max-width:820px){
  .cover__grid{grid-template-columns:1fr;gap:var(--space-6);padding-block:var(--space-6)}
  .cover__kicker{margin-bottom:var(--space-6)}
  .cover__side{align-items:flex-start;flex-direction:column-reverse}
  .cover__side .sb-logo{display:none}
  .cover__photo{aspect-ratio:3/2}
  .cover__cap{margin-top:0;order:-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){border-top:var(--border-hair) solid var(--grey-20)}
}

/* Fact strip — grey panel bleeding off both edges */
.strip{background:var(--surface-panel)}
.strip__grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-5);padding-block:var(--space-5)}
.strip__item>b{display:block;font:700 16px/24px var(--font-sans)}
.strip__item>span{display:block;font:300 16px/22px var(--font-sans)}
@media (max-width:820px){.strip__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.strip__grid{grid-template-columns:1fr;gap:var(--space-4)}}

/* ---------- Sections ---------- */
.sec{padding-block:var(--space-8)}
.sec--band{background:var(--surface-panel)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-5);margin-bottom:var(--space-6)}
.sec-head__kicker{font:300 20px/24px var(--font-sans);margin-bottom:var(--space-3)}
.sec-head__h{font:300 32px/38px var(--font-sans);text-wrap:balance;max-width:22em}
.sec-head__h b,.sec-head__h .sb-pname{font-weight:700}
.sec-head__h .sb-pname__suffix,.sec-head__h .sb-pname__reg{font-weight:300}
.sec-sub{font:300 18px/26px var(--font-sans);max-width:42em;margin-bottom:var(--space-6)}
html[lang="zh-Hant-TW"] .sec-sub{line-height:28px}
.sub-h{font:700 24px/28px var(--font-sans);margin:var(--space-7) 0 var(--space-4)}
.label{font:700 16px/24px var(--font-sans)}
.cap{font:400 13px/16px var(--font-sans)}
.muted{color:var(--ink-muted)}
@media (max-width:640px){.sec{padding-block:var(--space-7)}.sec-head__h{font-size:26px;line-height:32px}}

/* ---------- Mechanism ---------- */
.stage3d{position:relative;background:var(--surface-panel);aspect-ratio:16/9;max-height:620px;width:100%;overflow:hidden}
.stage3d canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.stage3d canvas:active{cursor:grabbing}
.stage3d__cap{position:absolute;left:var(--space-4);top:var(--space-4);right:var(--space-4);display:flex;gap:var(--space-3);align-items:baseline;pointer-events:none}
.stage3d__capbox{background:rgba(255,255,255,.96);padding:var(--space-2) var(--space-3);font:700 16px/24px var(--font-sans);display:flex;gap:var(--space-3);max-width:100%}
.stage3d__capbox span:first-child{font-weight:300;font-variant-numeric:tabular-nums}
.stage3d__fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:var(--space-5);text-align:center;font:300 16px/24px var(--font-sans)}
.player{display:flex;align-items:center;gap:var(--space-3);background:var(--white);border-bottom:var(--border-hair) solid var(--line-strong);padding:var(--space-3) 0}
.sec--band .player{background:transparent}
.player__track{position:relative;flex:1;min-width:0;padding-bottom:22px}
.player__scrub{width:100%;margin:0;height:24px;accent-color:var(--red);cursor:pointer;display:block}
.player__marks{position:absolute;left:0;right:0;bottom:0;height:20px}
.player__mark{position:absolute;transform:translateX(-50%);appearance:none;border:0;background:none;font:700 12px/16px var(--font-sans);color:var(--ink);cursor:pointer;padding:2px 6px;min-width:28px}
.player__mark::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:6px;background:var(--ink)}
.player__mark:hover{color:var(--red-ink)}
.player__time{font:400 13px/16px var(--font-sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.mech{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:var(--space-6);align-items:start}
.mech>*{min-width:0}
.how{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:var(--space-7);margin-top:var(--space-7);align-items:start}
.how__steps{display:grid;gap:0;border-top:var(--border-hair) solid var(--line-strong)}
.how-step{appearance:none;background:none;border:0;border-bottom:var(--border-hair) solid var(--line);text-align:left;display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--space-3);padding:var(--space-4) 0;cursor:pointer;color:var(--ink);font:inherit;width:100%}
.how-step__num{font:300 24px/28px var(--font-sans);font-variant-numeric:tabular-nums}
.how-step h3{font:700 16px/24px var(--font-sans)}
.how-step p{font:300 16px/24px var(--font-sans);display:none;margin-top:var(--space-1)}
html[lang="zh-Hant-TW"] .how-step p{line-height:26px}
.how-step[aria-current="true"] p{display:block}
.how-step[aria-current="true"] .how-step__num{font-weight:700;color:var(--red-ink)}
.how-step:hover h3{text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:var(--border-hair) solid var(--ink);margin-bottom:var(--space-3);max-width:100%}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:700 14px/18px var(--font-sans);padding:0 var(--space-4);min-height:44px;cursor:pointer;transition:background-color .15s,color .15s}
.seg button+button{border-left:var(--border-hair) solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.diagram{background:var(--white);border-top:var(--border-hair) solid var(--line-strong);border-bottom:var(--border-hair) solid var(--line-strong);padding-block:var(--space-3)}
.diagram{overflow-x:auto;position:relative}
.diagram svg{display:block;width:100%;height:auto;min-width:540px}
.diagram-note{font:400 13px/16px var(--font-sans);margin-top:var(--space-2)}
.how__modeldesc{font:300 16px/24px var(--font-sans);margin-bottom:var(--space-4)}
@media (max-width:900px){.mech,.how{grid-template-columns:1fr;gap:var(--space-5)}.stage3d{aspect-ratio:4/3}}

/* ---------- Advantages ---------- */
.adv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-6) var(--space-6)}
.adv__item{border-top:var(--border-hair) solid var(--line-strong);padding-top:var(--space-3)}
.adv__val{font:700 32px/38px var(--font-sans);font-variant-numeric:tabular-nums}
.adv__val small{font:300 16px/24px var(--font-sans);display:block;min-height:24px}
.adv__title{font:700 16px/24px var(--font-sans);margin-top:var(--space-2)}
.adv__desc{font:300 16px/24px var(--font-sans)}
.pictos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5);margin-top:var(--space-7)}
.sb-picto{display:flex;align-items:center;gap:var(--space-3)}
.sb-picto__icon{flex:none;width:72px;height:72px}
.sb-picto__title{font:700 19px/24px var(--font-sans);color:var(--red-ink)}
.sb-picto__text{font:400 16px/22px var(--font-sans)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-6);margin-top:var(--space-7)}
.cols3 .label{margin-bottom:var(--space-2)}
@media (max-width:900px){.adv,.cols3,.pictos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.adv,.cols3,.pictos{grid-template-columns:1fr}}

/* ---------- Procedure timeline ---------- */
.tl-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-5)}
.tl-bar .sec-sub{margin-bottom:0}
.tl-ctrl{display:flex;gap:var(--space-2);flex:none}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,calc((100% - 3 * var(--column-gutter)) / 4));gap:var(--column-gutter);overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:var(--space-4);scrollbar-color:var(--grey-70) var(--grey-10)}
.tl-step{scroll-snap-align:start;appearance:none;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column}
.tl-step__img{display:block;width:100%;aspect-ratio:11/10;background:var(--surface-panel);overflow:hidden}
.sec--band .tl-step__img{background:var(--white)}
.tl-step__img svg{display:block;width:100%;height:100%}
.tl-step__title{font:700 16px/24px var(--font-sans);margin-top:var(--space-2)}
.tl-step__text{font:300 16px/24px var(--font-sans);margin-bottom:var(--space-2)}
html[lang="zh-Hant-TW"] .tl-step__text{line-height:26px}
.tl-step .sb-link{margin-top:auto}
.tl-step:hover .sb-link{text-decoration:underline;text-underline-offset:3px}

/* Modal */
.modal-ov{position:fixed;inset:0;z-index:100;background:rgba(35,31,32,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal{background:var(--white);width:min(1040px,100%);margin-block:auto;border-top:var(--border-bar) solid var(--blue)}
.modal__head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-4);padding:var(--space-5) var(--space-5) 0}
.modal__tag{font:300 16px/24px var(--font-sans)}
.modal__title{font:700 24px/28px var(--font-sans)}
.modal__body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6);padding:var(--space-5)}
.modal__fig{background:var(--surface-panel);align-self:start}
.modal__fig{overflow-x:auto;position:relative}
.modal__fig svg{display:block;width:100%;height:auto;min-width:480px}
.modal__text{display:grid;gap:var(--space-5);align-content:start}
.modal__text h4{font:700 16px/24px var(--font-sans);margin-bottom:var(--space-1)}
.modal__src{font:300 13px/16px var(--font-sans);color:var(--ink-muted)}
.warn{border-top:var(--border-hair) solid var(--line-strong);border-bottom:var(--border-hair) solid var(--line-strong);padding-block:var(--space-3);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-3)}
.warn::before{content:"";width:0;height:0;border-style:solid;border-width:6px 0 6px 7px;border-color:transparent transparent transparent var(--red);margin-top:6px}
.warn b{display:block}
.modal__nav{display:flex;justify-content:space-between;gap:var(--space-4);padding:0 var(--space-5) var(--space-5)}
@media (max-width:760px){.modal__body{grid-template-columns:1fr}}

/* ---------- 3D inspection ---------- */
.m3d-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.m3d-bar .seg{margin-bottom:0}
.m3d-tools{display:flex;gap:var(--space-2);flex-wrap:wrap}
.m3d-note{font:400 13px/16px var(--font-sans);margin-top:var(--space-2)}
.sb-btn[aria-pressed="true"]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.sb-btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.m3d-hint{position:absolute;left:var(--space-4);bottom:var(--space-4);background:rgba(255,255,255,.96);padding:var(--space-1) var(--space-3);font:400 13px/16px var(--font-sans);pointer-events:none}
.callouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-6);margin-top:var(--space-6)}
.callout{border-top:var(--border-hair) solid var(--line-strong);padding-top:var(--space-3)}
.callout h3{font:700 16px/24px var(--font-sans)}
@media (max-width:760px){.callouts{grid-template-columns:1fr;gap:var(--space-5)}}

/* ---------- Simulator gate (inverse) ---------- */
.gate{background:var(--surface-inverse);color:var(--white);padding-block:var(--space-8)}
.gate__grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:var(--space-7);align-items:end}
.gate__eyebrow{font:400 20px/24px var(--font-sans);color:var(--on-navy);margin-bottom:var(--space-5)}
.gate__title{font:700 clamp(30px,4vw,48px)/1.16 var(--font-sans);color:var(--on-navy)}
.gate__title span{font-weight:300;display:block}
.gate__desc{font:400 18px/26px var(--font-sans);margin-top:var(--space-5);max-width:38em}
html[lang="zh-Hant-TW"] .gate__desc{line-height:28px}
.gate__meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:var(--border-hair) solid var(--ice)}
.gate__meta div{padding:var(--space-3) var(--space-3) var(--space-5) 0}
.gate__meta b{display:block;font:700 32px/38px var(--font-sans);color:var(--on-navy);font-variant-numeric:tabular-nums}
.gate__meta span{font:400 14px/18px var(--font-sans)}
.gate__foot{font:400 13px/16px var(--font-sans);margin-top:var(--space-3)}
@media (max-width:820px){.gate__grid{grid-template-columns:1fr;gap:var(--space-6)}}

/* ---------- Specs ---------- */
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6)}
.pack{border-top:var(--border-hair) solid var(--line-strong);padding-top:var(--space-3)}
.pack__size{font:700 32px/38px var(--font-sans)}
.pack__size small{font:300 18px/26px var(--font-sans)}
.pack dl{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:0;margin:var(--space-3) 0 0}
.pack dt,.pack dd{margin:0;padding:var(--space-2) var(--space-3) var(--space-2) 0;border-bottom:var(--border-hair) solid var(--line)}
.pack dt{font-weight:400}
.spec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-7) var(--space-6);margin-top:var(--space-7)}
.downloads{display:grid;gap:var(--space-2);margin-top:var(--space-4)}
.spec-grid>*,.packs>*,.calc>*,.how>*,.cols3>*,.adv>*,.callouts>*,.cover__grid>*,.gate__grid>*,.imprint__grid>*{min-width:0}
@media (max-width:820px){.packs,.spec-grid{grid-template-columns:1fr}}

/* ---------- Calculator / quotation ---------- */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-6);align-items:start}
.calc__form{display:grid;gap:var(--space-4)}
.calc details{background:var(--white)}
.calc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);font:700 16px/24px var(--font-sans);border-bottom:var(--border-hair) solid var(--line-strong);min-height:48px}
.calc summary::-webkit-details-marker{display:none}
.calc summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s;flex:none}
.calc details[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.calc__body{padding:var(--space-4);display:grid;gap:var(--space-4)}
.calc__body>*,.calc__form>*,.calc__preview>*{min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3) var(--space-4)}
.fgrid .full{grid-column:1/-1}
.field{display:grid;gap:var(--space-1);min-width:0}
.field label{font:700 14px/18px var(--font-sans);min-height:36px;display:flex;align-items:flex-end}
.field.full label{min-height:0}
.field input,.field select,.field textarea{width:100%;min-width:0;min-height:44px;padding:0 var(--space-3);border:var(--border-hair) solid var(--grey-70);border-radius:0;background:var(--white);color:var(--ink);font:300 16px/24px var(--font-sans);font-variant-numeric:tabular-nums}
.field textarea{padding:var(--space-2) var(--space-3);min-height:72px;resize:vertical}
.field small{font:300 13px/16px var(--font-sans);color:var(--ink-muted)}
.field--error input{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.field--error small{color:var(--red-ink);font-weight:400}
.cracks{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cracks th{font:700 13px/16px var(--font-sans);text-align:left;padding:0 var(--space-2) var(--space-1) 0;border-top:var(--border-accent) solid var(--line-accent);padding-top:var(--space-2);vertical-align:bottom}
.cracks td{padding:var(--space-1) var(--space-2) var(--space-1) 0;border-bottom:var(--border-hair) solid var(--grey-20)}
.cracks input{width:100%;min-width:0;min-height:40px;padding:0 var(--space-2);border:var(--border-hair) solid var(--grey-70);border-radius:0;font:300 16px/24px var(--font-sans);font-variant-numeric:tabular-nums;background:var(--white);color:var(--ink)}
.cracks td:last-child{width:44px;padding-right:0}
.cracks-wrap{overflow-x:auto;position:relative}
.sb-table-wrap,.tl{position:relative}
.cracks-wrap table{min-width:440px}
.iconbtn{appearance:none;border:var(--border-hair) solid var(--ink);background:transparent;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--ink);color:var(--white)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:var(--border-hair) solid var(--line-strong);background:var(--white);padding-inline:var(--space-4)}
.kpi{padding:var(--space-3) var(--space-3) var(--space-4) 0}
.kpi+.kpi{padding-left:var(--space-3);border-left:var(--border-hair) solid var(--grey-20)}
.kpi b{display:block;font:700 24px/28px var(--font-sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{display:block}
.kpi span{font:300 13px/16px var(--font-sans)}
.calc__preview{position:sticky;top:calc(var(--header-h) + 60px);display:grid;gap:var(--space-3)}
.calc__actions{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-3);align-items:center}
.a4-frame{background:var(--grey-20);padding:var(--space-3);overflow:hidden}
.a4-scale{transform-origin:top left}
.calc__status{font:400 13px/16px var(--font-sans);min-height:16px}
.example-note{font:400 13px/16px var(--font-sans);border-left:0;display:flex;gap:var(--space-2);align-items:baseline}
.example-note::before{content:"";flex:none;width:0;height:0;border-style:solid;border-width:5px 0 5px 6px;border-color:transparent transparent transparent var(--red)}
@media (max-width:980px){.calc{grid-template-columns:1fr}.calc__preview{position:static}}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){padding-left:0;border-left:0}.kpi:nth-child(n+3){border-top:var(--border-hair) solid var(--grey-20)}}

/* A4 document (preview and export share these rules) */
.sec-photo{opacity:0;transition:opacity .4s ease}.sec-photo[href]{opacity:1}
@media (prefers-reduced-motion:reduce){.sec-photo{transition:none}}

/* scenario selector: one choice drives the 3D mechanism, the steps and the cross-section */
.scn{margin:var(--space-6) 0 var(--space-6)}
.scn__head{margin-bottom:var(--space-4)}
.scn__title{font:700 24px/32px var(--font-sans);margin:4px 0 4px}
.scn__sub{font:300 16px/24px var(--font-sans);color:var(--ink);max-width:70ch;margin:0}
.scn__tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--grey-20)}.scn-tile:nth-child(7n){border-right:0}.scn-tile:nth-child(-n+7){border-bottom:1px solid var(--grey-20)}
.scn-tile{appearance:none;background:none;border:0;border-right:1px solid var(--grey-20);padding:var(--space-3) var(--space-2) var(--space-3);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);cursor:pointer;color:var(--ink);font:300 13px/18px var(--font-sans);text-align:center;position:relative;min-width:0}
.scn-tile:last-child{border-right:0}
.scn-tile svg{width:56px;height:40px;fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:miter}
.scn-tile svg .r{stroke:var(--red,#e3000f);stroke-width:2.2}
.scn-tile svg .w{stroke:var(--cyan,#00aeef);stroke-width:1.6}
.scn-tile svg .d{fill:var(--grey-50);stroke:none}
.scn-tile svg .k{stroke-width:2.4}
.scn-tile svg .k2{fill:var(--white,#fff);stroke-width:1.6}
.scn-tile:hover{background:var(--surface-panel,#e6e7e8)}
.scn-tile[aria-selected="true"]{font-weight:700;background:var(--white,#fff)}
.scn-tile[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--red,#e3000f)}
.scn-tile:focus-visible{outline:2px solid var(--blue,#005baa);outline-offset:-2px}
.scn__panel{display:grid;grid-template-columns:1fr 1.35fr .9fr;gap:var(--space-6);padding:var(--space-5) 0 0}
.scn__panel h4{font:700 13px/18px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;margin:0 0 var(--space-2);color:var(--grey-70)}
.scn__panel p{font:300 16px/24px var(--font-sans);margin:0}
.scn__name{font:700 20px/28px var(--font-sans)!important;margin:0 0 var(--space-2)!important}
.scn-chips{display:flex;flex-wrap:wrap;gap:var(--space-2);list-style:none;margin:0;padding:0}
.scn-chips a{display:inline-block;border:1px solid var(--ink);padding:6px 10px;font:300 14px/20px var(--font-sans);color:var(--ink);text-decoration:none}
.scn-chips a b{font-weight:700}
.scn-chips a:hover{background:var(--ink);color:var(--white,#fff)}
.scn__note{grid-column:1/-1;font:300 13px/20px var(--font-sans);color:var(--grey-70);margin:0}
.scn__note a{color:inherit}
/* scenario bar: the same choice, offered again where the procedure and the 3D model follow it */
.scnbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-5);margin:0 0 var(--space-5);padding:var(--space-3) var(--space-4);background:var(--surface-panel);border-top:var(--border-accent) solid var(--line-accent)}
.sec--band .scnbar{background:var(--white)}
.scnbar__label{font:700 14px/18px var(--font-sans)}
.scnbar__sel{position:relative;display:flex;align-items:center;flex:1 1 280px;max-width:420px;min-width:0;background:var(--white);border:var(--border-hair) solid var(--ink)}
.sec--band .scnbar__sel{background:var(--white)}
.scnbar__icon{flex:none;width:48px;height:34px;margin-left:var(--space-2);fill:none;stroke:var(--ink);stroke-width:1.4;pointer-events:none}
.scnbar__icon .r{stroke:var(--red);stroke-width:2.2}.scnbar__icon .w{stroke:var(--cyan);stroke-width:1.6}.scnbar__icon .d{fill:var(--grey-50);stroke:none}.scnbar__icon .k{stroke-width:2.4}.scnbar__icon .k2{fill:var(--white);stroke-width:1.6}
.scnbar__select{appearance:none;-webkit-appearance:none;flex:1;min-width:0;min-height:44px;border:0;border-radius:0;background:transparent;color:var(--ink);font:700 16px/24px var(--font-sans);padding:0 40px 0 var(--space-3);cursor:pointer;text-overflow:ellipsis}
.scnbar__sel::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.scnbar .seg{margin-bottom:0;background:var(--white)}
.scnbar__all{margin-left:auto;font-size:14px}
.seg--scroll{overflow-x:auto;scrollbar-width:thin;max-width:100%}
.seg--scroll button{white-space:nowrap;flex:none}
.seg button .n{font-weight:300;margin-right:6px;font-variant-numeric:tabular-nums}
.modal__scn{border-top:var(--border-accent) solid var(--line-accent);padding-top:var(--space-3)}
.modal__scn h4 span{font-weight:300}
.modal__scn small{display:block;font:300 13px/16px var(--font-sans);color:var(--ink-muted);margin-top:var(--space-2)}
.tl-step__img{position:relative}

.gantt1__row b{font-weight:700}
.gantt1__row small{display:block;font:300 12px/15px var(--font-sans);color:var(--ink-muted)}
.gantt1__bar{display:flex;height:22px;background:var(--grey-10);border-radius:var(--radius-sm);overflow:hidden}
.gantt1__bar i{display:block;height:100%}
.gantt1__bar i.g{background:#9a9a9a}.gantt1__bar i.p{background:#e7c26a}.gantt1__bar i.o{background:#e5e5e5}.gantt1__bar i.n{background:var(--red)}.gantt1__bar i.tc{background:#333}
.gantt1__sum{font:700 15px/18px var(--font-latin);text-align:right;font-variant-numeric:tabular-nums}
.gantt1__legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);font:400 13px/18px var(--font-sans);margin-top:var(--space-1)}
.gantt1__legend span{display:inline-flex;align-items:center;gap:6px}
.gantt1__legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
.sim1__hilite{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:var(--border-hair) solid var(--line-strong);background:var(--white);padding-inline:var(--space-4)}
.sim1__hilite div{padding:var(--space-3) var(--space-3) var(--space-4) 0}
.sim1__hilite div+div{padding-left:var(--space-3);border-left:var(--border-hair) solid var(--grey-20)}
.sim1__hilite b{display:block;font:700 26px/30px var(--font-latin);font-variant-numeric:tabular-nums;white-space:nowrap}
.sim1__hilite b small{font:300 15px/18px var(--font-sans)}
.sim1__hilite span{display:block;font:300 13px/17px var(--font-sans)}
@media (max-width:980px){.sim1{grid-template-columns:1fr}}
@media (max-width:560px){.sim1__hilite{grid-template-columns:1fr}.sim1__hilite div+div{padding-left:0;border-left:0;border-top:var(--border-hair) solid var(--grey-20)}.gantt1__row{grid-template-columns:1fr;gap:4px}.gantt1__sum{text-align:left}}

/* ================= quotation: price table, A4 preview ================= */
.price-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.price-table th{font:700 13px/16px var(--font-sans);text-align:left;padding:var(--space-2) var(--space-2) var(--space-1) 0;border-top:var(--border-accent) solid var(--line-accent);vertical-align:bottom}
.price-table td{padding:var(--space-1) var(--space-2) var(--space-1) 0;border-bottom:var(--border-hair) solid var(--grey-20);font:300 15px/20px var(--font-sans)}
.price-table td:last-child{width:150px;padding-right:0}
.price-table input{width:100%;min-width:0;min-height:40px;padding:0 var(--space-2);border:var(--border-hair) solid var(--grey-35);border-radius:var(--radius-lg);font:300 16px/24px var(--font-sans);font-variant-numeric:tabular-nums;background:var(--white);color:var(--ink);text-align:right}
.price-table td small{display:block;font:300 12px/15px var(--font-sans);color:var(--ink-muted)}
.calc__preview .a4-frame{overflow:hidden}
.q-kpis .kpi b{font-size:22px;line-height:26px}
.q-kpis .kpi b small{font:300 13px/16px var(--font-sans)}

/* ================= PROTECT ONE: points, substrates, before/after ================= */
.points{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-6) var(--space-5)}
.point{border-top:var(--border-accent) solid var(--red);padding-top:var(--space-3)}
.point .k{font:700 12px/16px var(--font-latin);letter-spacing:.08em;text-transform:uppercase;color:var(--red-ink-hover)}
.point h3{font:700 20px/26px var(--font-sans);margin:var(--space-1) 0 2px}
.point .en{font:400 13px/18px var(--font-latin);color:var(--ink-muted);margin-bottom:var(--space-2);letter-spacing:.02em}
.point p{font:300 16px/24px var(--font-sans)}
@media (max-width:900px){.points{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.points{grid-template-columns:1fr}}
.subs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--grey-20)}
.sub{appearance:none;background:none;border:0;border-right:1px solid var(--grey-20);padding:var(--space-3) var(--space-2);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);cursor:pointer;color:var(--ink);font:300 14px/18px var(--font-sans);text-align:center;position:relative;min-width:0}
.sub:last-child{border-right:0}
.sub svg{width:56px;height:40px;fill:none;stroke:var(--ink);stroke-width:1.4}
.sub svg .f{fill:var(--grey-10);stroke:var(--ink)}
.sub svg .r{stroke:var(--red);stroke-width:2.2}
.sub:hover{background:var(--surface-panel)}
.sub[aria-selected="true"]{font-weight:700;background:var(--white)}
.sub[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--red)}
.sub-panel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--space-6);padding-top:var(--space-5)}
.sub-panel h4{font:700 13px/18px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;margin:0 0 var(--space-2);color:var(--grey-70)}
.sub-panel p{font:300 16px/24px var(--font-sans)}
.sub-panel .scn__name{font:700 20px/28px var(--font-sans);margin:0 0 var(--space-2)}
@media (max-width:1100px){.subs{grid-template-columns:repeat(3,minmax(0,1fr))}.sub:nth-child(3){border-right:0}.sub:nth-child(-n+3){border-bottom:1px solid var(--grey-20)}}
@media (max-width:640px){.subs{grid-template-columns:repeat(2,minmax(0,1fr))}.sub{border-right:0!important;border-bottom:1px solid var(--grey-20)!important}.sub:nth-child(odd){border-right:1px solid var(--grey-20)!important}.sub-panel{grid-template-columns:1fr}}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6)}
.test{border-top:var(--border-hair) solid var(--line-strong);padding-top:var(--space-3)}
.test h3{font:700 16px/24px var(--font-sans);margin-bottom:var(--space-1)}
.test p{font:300 16px/24px var(--font-sans)}
.test .fig{display:block;width:100%;height:auto;margin-bottom:var(--space-3);background:var(--surface-panel)}
@media (max-width:760px){.tests{grid-template-columns:1fr}}
.gaps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2) var(--space-6)}
@media (max-width:640px){.gaps{grid-template-columns:1fr}}

/* ================= dark theme: the brand's black band values. The 3D stages go black with the page (renderer + fog in CRView.setTheme); the A4 quotation stays white ================= */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--surface:#111111;--surface-panel:#1c1c1c;--surface-alt:#181818;--surface-photo:#2a2a2a;--ink:#f2f2f2;--ink-muted:#b7b7b7;--white:#111111;--black:#f2f2f2;--line:#555555;--line-strong:#e5e5e5;--grey-10:#2a2a2a;--grey-20:#3a3a3a;--grey-35:#5a5a5a;--grey-40:#6d6d6d;--grey-70:#b7b7b7;--navy:#000000;--blue:#e5e5e5}
  :root:not([data-theme="light"]) .a4{background:#ffffff;color:#111111}
  :root:not([data-theme="light"]) .sb-btn--primary{color:#ffffff}
  :root:not([data-theme="light"]) .imprint,:root:not([data-theme="light"]) .gate{background:#000;color:#e5e5e5}
  :root:not([data-theme="light"]) .tl-step__tag{background:#f97b00;color:#fff}
  :root:not([data-theme="light"]) .toast{background:#f2f2f2;color:#111}
  :root:not([data-theme="light"]) .stage3d,:root:not([data-theme="light"]) .cr-sec,:root:not([data-theme="light"]) .cr-hero__pic.is-3d,:root:not([data-theme="light"]) img.cr-snap,:root:not([data-theme="light"]) .modal__fig{background:#111111}
  :root:not([data-theme="light"]) .cr-sec{border-color:#3a3a3a}
  :root:not([data-theme="light"]) .stage3d__capbox,:root:not([data-theme="light"]) .m3d-hint{background:rgba(17,17,17,.86);color:#f2f2f2}
  :root:not([data-theme="light"]) .cr-sec__tools .sb-btn{background:rgba(28,28,28,.92);color:#f2f2f2;border-color:#6d6d6d}
  :root:not([data-theme="light"]) .cr-sec__tools .sb-btn:hover{background:#f2f2f2;color:#111}
  :root:not([data-theme="light"]) .cr-hero__marks button{background:#f2f2f2;color:#111;border-color:#111}
  :root:not([data-theme="light"]) .cr-co text,:root:not([data-theme="light"]) .cr-fig text{fill:#f2f2f2;stroke:#111}
  :root:not([data-theme="light"]) .cr-co text[text-anchor="middle"]{fill:#111;stroke:none}
  :root:not([data-theme="light"]) .cr-co path[stroke="#fff"],:root:not([data-theme="light"]) .cr-fig path[stroke="#fff"]{stroke:#111}
  :root:not([data-theme="light"]) .cr-co path[stroke="#111"],:root:not([data-theme="light"]) .cr-fig path[stroke="#111"]{stroke:#e5e5e5}
  :root:not([data-theme="light"]) .cr-co circle[r="2.2"],:root:not([data-theme="light"]) .cr-fig circle[r="2.2"]{fill:#f2f2f2;stroke:#111}
}
:root[data-theme="dark"]{color-scheme:dark;--surface:#111111;--surface-panel:#1c1c1c;--surface-alt:#181818;--surface-photo:#2a2a2a;--ink:#f2f2f2;--ink-muted:#b7b7b7;--white:#111111;--black:#f2f2f2;--line:#555555;--line-strong:#e5e5e5;--grey-10:#2a2a2a;--grey-20:#3a3a3a;--grey-35:#5a5a5a;--grey-40:#6d6d6d;--grey-70:#b7b7b7;--navy:#000000;--blue:#e5e5e5}
:root[data-theme="dark"] .a4{background:#ffffff;color:#111111}
:root[data-theme="dark"] .sb-btn--primary{color:#ffffff}
:root[data-theme="dark"] .imprint,:root[data-theme="dark"] .gate{background:#000;color:#e5e5e5}
:root[data-theme="dark"] .tl-step__tag{background:#f97b00;color:#fff}
:root[data-theme="dark"] .toast{background:#f2f2f2;color:#111}
:root[data-theme="dark"] .stage3d,:root[data-theme="dark"] .cr-sec,:root[data-theme="dark"] .cr-hero__pic.is-3d,:root[data-theme="dark"] img.cr-snap,:root[data-theme="dark"] .modal__fig{background:#111111}
:root[data-theme="dark"] .cr-sec{border-color:#3a3a3a}
:root[data-theme="dark"] .stage3d__capbox,:root[data-theme="dark"] .m3d-hint{background:rgba(17,17,17,.86);color:#f2f2f2}
:root[data-theme="dark"] .cr-sec__tools .sb-btn{background:rgba(28,28,28,.92);color:#f2f2f2;border-color:#6d6d6d}
:root[data-theme="dark"] .cr-sec__tools .sb-btn:hover{background:#f2f2f2;color:#111}
:root[data-theme="dark"] .cr-hero__marks button{background:#f2f2f2;color:#111;border-color:#111}
:root[data-theme="dark"] .cr-co text,:root[data-theme="dark"] .cr-fig text{fill:#f2f2f2;stroke:#111}
:root[data-theme="dark"] .cr-co text[text-anchor="middle"]{fill:#111;stroke:none}
:root[data-theme="dark"] .cr-co path[stroke="#fff"],:root[data-theme="dark"] .cr-fig path[stroke="#fff"]{stroke:#111}
:root[data-theme="dark"] .cr-co path[stroke="#111"],:root[data-theme="dark"] .cr-fig path[stroke="#111"]{stroke:#e5e5e5}
:root[data-theme="dark"] .cr-co circle[r="2.2"],:root[data-theme="dark"] .cr-fig circle[r="2.2"]{fill:#f2f2f2;stroke:#111}
body{background:var(--surface)}
/* night mode, layered surfaces: the step modal and the products menu sit on a lighter panel with a hairline so they read as sheets over the page */
:root[data-theme="dark"] .modal{background:#1c1c1c;box-shadow:0 0 0 1px #3a3a3a,0 24px 60px rgba(0,0,0,.6)}
:root[data-theme="dark"] .modal-ov{background:rgba(0,0,0,.72)}
:root[data-theme="dark"] .pmenu__panel{background:#1c1c1c;border-color:#3a3a3a;box-shadow:0 22px 44px rgba(0,0,0,.55)}

/* ---- second pass: layout corrections ---- */
.ux-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.ux-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.ux-tiles .scn-tile:nth-child(-n+3){border-bottom:0}.ux-tiles .scn-tile:nth-child(3){border-right:0}}
@media (max-width:640px){.ux-tiles{grid-template-columns:1fr}.ux-tiles .scn-tile{border-right:0;border-bottom:1px solid var(--grey-20)}}
.sim1 .seg{justify-self:start;align-self:start}
@media (min-width:980px){.wp-ptabs{grid-template-columns:repeat(5,minmax(0,1fr))}}
.a4__bar{background:var(--red)}
.a4 thead th{border-top-color:var(--red)}
.a4__notes li::before{color:var(--red-ink)}
.a4__ex{color:var(--red-ink-hover)}
.mainbar__logo{background:var(--red);height:var(--header-h);padding:0 16px;align-self:stretch;display:flex;align-items:center;transition:background-color .15s}
.mainbar__logo:hover{background:var(--red-hover)}
.mainbar__logo img{display:block;height:36px;width:auto;max-width:none}
@media (max-width:480px){.mainbar__logo{padding:0 10px}.mainbar__logo img{height:26px}}
.cr-build--wide{grid-template-columns:1fr;margin-bottom:var(--space-6)}
.cr-build--wide .cr-build__fig{max-width:none}
.sub-panel .tbc{font-size:11px}
.test .fig{border:1px solid var(--grey-20)}
@media (min-width:980px){.wp-ptabs{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cert-table td,.cert-table th{font-variant-numeric:tabular-nums}
.cert-table tbody th{width:32%}
/* ---- the specification selector (system section) ---- */
.spec{margin:var(--space-8) 0 var(--space-6);padding:var(--space-5);background:var(--surface-panel,#fff);border-top:var(--border-accent) solid var(--red)}
.spec__head .scn__title{margin:var(--space-1) 0 var(--space-2)}
.spec__head .sec-sub{margin-bottom:var(--space-4)}
.spec__grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--space-5)}
@media (max-width:900px){.spec__grid{grid-template-columns:minmax(0,1fr)}}
.spec__opts{display:grid;gap:var(--space-2)}
.spec-opt{appearance:none;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;text-align:left;padding:var(--space-3) var(--space-4) var(--space-3) 44px;border:var(--border-hair) solid var(--grey-20);background:var(--grey-10);color:var(--ink);cursor:pointer;position:relative;border-radius:var(--radius-sm);font:inherit}
.spec-opt::before{content:"";position:absolute;left:16px;top:18px;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--white)}
.spec-opt[aria-checked="true"]{border-color:var(--red);background:var(--surface,#fff);box-shadow:inset 0 0 0 1px var(--red)}
.spec-opt[aria-checked="true"]::before{border-color:var(--red);background:radial-gradient(circle,var(--red) 0 4px,var(--white) 5px)}
.spec-opt__name{font:700 16px/22px var(--font-sans)}
.spec-opt__d{font:300 14px/20px var(--font-sans);color:var(--grey-70)}
.spec-opt__bars{display:flex;gap:3px;height:6px;margin-top:4px;max-width:240px}
.spec-opt__bars i{display:block;height:100%;background:var(--red);border-radius:2px;flex:0 0 auto;max-width:33%}
.spec-opt__bars i.grit{background:repeating-linear-gradient(90deg,var(--red) 0 3px,#fff 3px 5px)}
.spec__side .seg{margin-bottom:var(--space-3)}
.spec__side .seg button[disabled]{cursor:default;opacity:.55}
.spec__side .seg button[disabled][aria-pressed="true"]{opacity:1}
.spec__note{font:300 14px/20px var(--font-sans);margin:0 0 var(--space-2)}
/* ---- the QA / warranty checklist ---- */
.qa{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--space-6);align-items:start}
@media (max-width:900px){.qa{grid-template-columns:minmax(0,1fr)}}
.qa-table th[scope="row"]{width:34%;white-space:normal}
.qa__side .warn{margin-bottom:var(--space-4)}
.qa__side .warn b{display:block;margin-bottom:4px}
/* ---- the multi-day working clock ---- */
.tl1-day{font:700 13px/18px var(--font-latin);letter-spacing:.06em;text-transform:uppercase;color:var(--red-ink-hover);padding:var(--space-3) 0 var(--space-1);border-bottom:var(--border-hair) solid var(--ink)}
.tl1-row.cure .n{font-weight:400}
/* seven product tabs */
@media (min-width:980px){.wp-ptabs{grid-template-columns:repeat(7,minmax(0,1fr))}}
/* long product names in the product tabs wrap instead of pushing the page wider */
.cr-ptab,.cr-ptab .sb-pname,.cr-ptab .sb-pname__suffix{white-space:normal;overflow-wrap:anywhere;min-width:0}
/* ---- the technology comparison (UREAX-HG against five classes of liquid-applied waterproofing) ---- */
.vs-sec{border-top:var(--border-hair) solid var(--line)}
.vs-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:var(--border-hair) solid var(--line-strong);margin-bottom:var(--space-7)}
.vs-kpi{padding:var(--space-4) var(--space-4) var(--space-5) 0;display:grid;gap:2px;align-content:start}
.vs-kpi+.vs-kpi{padding-left:var(--space-4);border-left:var(--border-hair) solid var(--grey-20)}
.vs-kpi b{font:700 36px/40px var(--font-sans);font-variant-numeric:tabular-nums;color:var(--red-ink);white-space:nowrap}
.vs-kpi__vs{font:300 13px/16px var(--font-sans);color:var(--ink-muted)}
.vs-kpi__l{font:400 16px/22px var(--font-sans);margin-top:var(--space-1)}
@media (max-width:900px){.vs-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.vs-kpi:nth-child(3){padding-left:0;border-left:0}.vs-kpi:nth-child(n+3){border-top:var(--border-hair) solid var(--grey-20)}}
@media (max-width:420px){.vs-kpi b{font-size:30px;line-height:34px}}
.vs-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5)}
.vs-card{background:var(--surface-panel);border-top:var(--border-accent) solid var(--grey-35);padding:var(--space-4) var(--space-4) var(--space-5);display:grid;gap:var(--space-3);align-content:start;min-width:0}
.vs-card.is-hg{border-top-color:var(--red);background:var(--surface);box-shadow:inset 0 0 0 1px var(--red)}
.vs-card__tag{font:700 11px/14px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.vs-card.is-hg .vs-card__tag{color:var(--red-ink)}
.vs-card__name{font:700 20px/24px var(--font-sans);margin-top:-6px}
.vs-card__dl{margin:0;display:grid;gap:var(--space-2)}
.vs-card__dl dt{font:700 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.vs-card__dl dd{margin:0;font:300 15px/21px var(--font-sans)}
.vs-card__dl div:last-child dd{font-weight:400}
@media (max-width:1100px){.vs-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.vs-cards{grid-template-columns:1fr}}
.vs-bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-5) var(--space-6)}
.vs-metric{border-top:var(--border-hair) solid var(--line-strong);padding-top:var(--space-2);min-width:0}
.vs-metric__head{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2) var(--space-3);margin-bottom:var(--space-2)}
.vs-metric__head b{font:700 18px/24px var(--font-sans)}
.vs-metric__head span{font:300 13px/16px var(--font-sans);color:var(--ink-muted)}
.vs-bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:var(--space-3);padding:5px 0;border-top:var(--border-hair) solid var(--grey-10);align-items:center}
.vs-bar.is-hg{background:linear-gradient(90deg,rgba(249,123,0,.08),transparent 70%)}
.vs-bar__k{min-width:0;display:grid;gap:1px}
.vs-bar__k b{font:700 14px/18px var(--font-sans)}
.vs-bar__k small{font:300 11px/14px var(--font-sans);color:var(--ink-muted);overflow-wrap:anywhere}
.vs-bar__k small.alt::before{content:"↳ ";color:var(--grey-40)}
.vs-bar__t{display:grid;gap:3px;min-width:0}
.vs-bar__track{display:block;min-width:0}
.vs-bar__in{position:relative;display:block;height:16px;margin-right:64px}
.vs-bar__track--alt .vs-bar__in{height:8px}
.vs-bar__in i{position:absolute;left:0;top:0;height:100%;background:var(--grey-70);display:block}
.vs-bar__track.is-hg .vs-bar__in i{background:var(--red)}
.vs-bar__track--alt .vs-bar__in i{background:var(--grey-35)}
.vs-bar__in b{position:absolute;top:50%;transform:translateY(-50%);margin-left:6px;font:700 13px/16px var(--font-sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.vs-bar__track--alt .vs-bar__in b{font-weight:400;font-size:12px}
.vs-bar__in b.na{position:static;transform:none;margin-left:0;font-weight:300;color:var(--ink-muted);line-height:16px}

/* ---------- Hands-on simulator (first person) ---------- */
.hsim{position:fixed;inset:0;z-index:300;background:#111;color:#fff;font-family:var(--font-sans);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.hsim[hidden]{display:none!important}
body.hsim-open{overflow:hidden}
.hsim__view::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.28)}
.hsim__view{position:absolute;inset:0;cursor:crosshair}
.hsim__view canvas{display:block;width:100%;height:100%;touch-action:none}
.hsim.is-locked .hsim__view{cursor:none}
.hsim__cross{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;pointer-events:none;z-index:3}
.hsim__cross::before,.hsim__cross::after{content:"";position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 2px rgba(0,0,0,.8)}
.hsim__cross::before{left:13px;top:0;width:2px;height:28px}.hsim__cross::after{top:13px;left:0;height:2px;width:28px}
.hsim__cross i{position:absolute;left:11px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.hsim__ring{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:2;width:140px;height:140px}
.hsim__ring svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 3px rgba(0,0,0,.7))}
.hsim__ring .r0{fill:rgba(249,123,0,.08);stroke:rgba(255,255,255,.85);stroke-width:2.5;stroke-dasharray:6 5}
.hsim__ring .r1{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .12s linear}
.hsim__ring.is-on .r0{stroke:var(--red);stroke-dasharray:none;fill:rgba(249,123,0,.16)}
.hsim__ring.is-on{animation:hsPulse 1.2s ease-in-out infinite}
@keyframes hsPulse{0%,100%{filter:none}50%{filter:brightness(1.25)}}
.hsim__ringlbl{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);white-space:nowrap;max-width:min(60vw,360px);overflow:hidden;text-overflow:ellipsis;font:400 13px/18px var(--font-sans);background:rgba(17,17,17,.78);color:#fff;padding:3px 10px;border-left:3px solid var(--red)}
.hsim__arrow{position:absolute;width:44px;height:44px;pointer-events:none;z-index:3}
.hsim__arrow svg{width:100%;height:100%;fill:var(--red);filter:drop-shadow(0 0 4px rgba(0,0,0,.8));animation:hsPulse 1s ease-in-out infinite}
.hsim__marks{position:absolute;inset:0;pointer-events:none;z-index:2}
.hsim__mark{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;max-width:280px}

.hsim__clock{background:rgba(17,17,17,.78);padding:3px 10px;font:400 12px/16px var(--font-sans);font-variant-numeric:tabular-nums;color:#ddd}

.hsim__ico{appearance:none;width:44px;height:44px;border:1px solid rgba(255,255,255,.35);background:rgba(17,17,17,.72);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;border-radius:0}

#hsExit{border-color:#fff}
.hsim__feed{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);max-width:min(86vw,560px);text-align:center;font:700 16px/22px var(--font-sans);background:rgba(17,17,17,.85);padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:7;border-left:4px solid #fff}
.hsim__feed.is-on{opacity:1}.hsim__feed.is-bad{border-left-color:#ff5c5c;color:#ffb3b3}.hsim__feed.is-ok{border-left-color:#7bd88f;color:#c9f5d1}
.hsim__toolname{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 92px);transform:translateX(-50%);font:700 14px/18px var(--font-sans);background:rgba(17,17,17,.7);padding:3px 10px;pointer-events:none;z-index:5;white-space:nowrap}
.hsim__toolname:empty{display:none}
.hsim__tools{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100% - 24px);overflow-x:auto;padding:4px;scrollbar-width:none;z-index:5;background:rgba(17,17,17,.5)}
.hsim__tools::-webkit-scrollbar{display:none}
.hsim__tool{appearance:none;flex:none;width:76px;height:72px;border:1px solid rgba(255,255,255,.3);background:rgba(17,17,17,.78);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;position:relative;border-radius:0}
.hsim__tool svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hsim__tool span{font:400 11px/13px var(--font-sans);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsim__tool i{position:absolute;left:5px;top:3px;font:400 10px/12px var(--font-sans);font-style:normal;color:#aaa}
.hsim__tool[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#111}.hsim__tool[aria-pressed="true"] i{color:#111}
.hsim__tool.is-next{border-color:var(--red);box-shadow:0 0 0 2px rgba(249,123,0,.45);animation:hsNext 1.1s ease-in-out infinite}
@keyframes hsNext{0%,100%{box-shadow:0 0 0 2px rgba(249,123,0,.35)}50%{box-shadow:0 0 0 6px rgba(249,123,0,.65)}}
.hsim__stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 96px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.35);display:none;z-index:6;touch-action:none}
.hsim__stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff}
.hsim__work{appearance:none;position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 96px);width:108px;height:108px;border-radius:50%;border:3px solid var(--red);background:rgba(249,123,0,.22);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:6;touch-action:none;cursor:pointer;padding:0}
.hsim__work b{font:700 20px/24px var(--font-sans)}.hsim__work span{font:400 11px/14px var(--font-sans);color:#ffd9b3}
.hsim__work.is-on{background:var(--red);color:#111}.hsim__work.is-on span{color:#4a2a00}
.hsim.is-touch .hsim__stick,.hsim.is-touch .hsim__work{display:flex}
.hsim__card,.hsim__help{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) 12px 12px;background:rgba(0,0,0,.55);overflow:auto}
.hsim__card[hidden],.hsim__help[hidden]{display:none}
.hsim__cardin{background:#1b1b1b;color:#fff;width:min(760px,100%);max-height:100%;overflow:auto;padding:22px 24px 24px;border-top:5px solid var(--red);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.hsim__cardin h2{font:700 24px/30px var(--font-sans);margin:0 0 8px}
.hsim__cardin p{font:400 15px/22px var(--font-sans);margin:0 0 10px;color:#e6e6e6}
.hsim__kick{font:700 13px/18px var(--font-sans);color:#ffc08a;letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px!important}
.hsim__sub{color:#cfcfcf!important}
.hsim__loading{display:flex;align-items:center;gap:10px;color:#bbb!important}.hsim__loading i{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--red);border-radius:50%;animation:hsSpin .9s linear infinite;flex:none}
@keyframes hsSpin{to{transform:rotate(360deg)}}
.hsim__meta{font-size:13px!important;color:#aaa!important}
.hsim__h4{font:700 13px/18px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:#aaa;margin:14px 0 6px!important}
.hsim__cols{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
.hsim__toollist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hsim__toollist li{display:flex;align-items:center;gap:8px;font:400 14px/20px var(--font-sans)}
.hsim__toollist svg{width:22px;height:22px;fill:none;stroke:var(--red);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hsim__toollist i{font-style:normal;color:#888;font-size:12px}
.hsim__ctrl{margin:0;padding:0 0 0 18px;display:grid;gap:4px;font:400 14px/20px var(--font-sans);color:#ddd}
.hsim__cardact{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hsim__cardin .sb-btn--secondary{border-color:#fff;color:#fff}.hsim__cardin .sb-btn--secondary:hover{background:#fff;color:#111}
.hsim__opts{display:grid;gap:8px;margin:12px 0}
.hsim__opt{appearance:none;text-align:left;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.06);color:#fff;font:400 15px/21px var(--font-sans);padding:10px 14px;cursor:pointer;border-radius:0}
.hsim__opt:hover{border-color:var(--red)}
.hsim__opt.is-ok{background:rgba(123,216,143,.22);border-color:#7bd88f}.hsim__opt.is-bad{background:rgba(255,92,92,.2);border-color:#ff5c5c}
.hsim__why{border-left:3px solid var(--red);padding-left:10px;color:#ffe0c2!important}
.hsim__dose{display:flex;align-items:center;gap:14px;margin:10px 0}
.hsim__dose input{flex:1;accent-color:var(--red);min-height:44px}
.hsim__dose output{font:700 22px/26px var(--font-sans);font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.hsim__holdbar u,.hsim__lapse u{display:block;height:14px;background:rgba(255,255,255,.14);text-decoration:none;margin:10px 0}
.hsim__holdbar i,.hsim__lapse i{display:block;height:100%;width:0;background:var(--red);transition:width .08s linear}
.hsim__lapse b{font:700 26px/30px var(--font-sans);font-variant-numeric:tabular-nums}
.hsim__kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.hsim__kpis div{background:rgba(255,255,255,.06);padding:10px 12px;border-top:3px solid var(--red)}
.hsim__kpis b{display:block;font:700 26px/30px var(--font-sans);font-variant-numeric:tabular-nums}.hsim__kpis span{font:400 12px/16px var(--font-sans);color:#bbb}
.hsim__notes{margin:0;padding-left:18px;font:400 14px/20px var(--font-sans);color:#ffd0a8}
.hsim__cons{width:100%;border-collapse:collapse;font:400 13px/18px var(--font-sans)}
.hsim__cons th,.hsim__cons td{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid rgba(255,255,255,.15);vertical-align:top}
.hsim__cons th{font-weight:700;width:46%}
.hsim.is-narrow .hsim__cols{grid-template-columns:1fr}
.hsim.is-narrow .hsim__stat{margin-right:48px}
.hsim.is-narrow .hsim__box:not(.is-open) .hsim__prompt::after{content:' ▾';color:#ffc08a}
.hsim.is-narrow .hsim__tool{width:66px;height:64px}
.hsim.is-narrow .hsim__cardin{padding:16px 16px 18px}
.hsim.is-narrow .hsim__cardin h2{font-size:20px;line-height:26px}
.hsim.is-narrow .hsim__kpis{grid-template-columns:repeat(3,1fr);gap:6px}
.hsim.is-narrow .hsim__kpis b{font-size:20px}
.hsim.is-narrow .hsim__feed{top:30%}
@media (max-height:520px){.hsim__stick{width:96px;height:96px}.hsim__work{width:88px;height:88px}.hsim__tool{height:56px}.hsim__tool svg{width:20px;height:20px}}
/* the gate on the page */
/* the gate: a dark band lit from the brand — the work ring of the simulator as a motif, the sun glow of the site behind the button */
.gate{position:relative;overflow:hidden;color:#fff;padding-block:var(--space-8);isolation:isolate;
  background:
    radial-gradient(ellipse 46% 70% at 88% 115%,rgba(249,123,0,.62),rgba(249,123,0,0) 70%),
    radial-gradient(ellipse 60% 55% at 0% -10%,rgba(255,192,138,.16),rgba(255,192,138,0) 60%),
    linear-gradient(170deg,#2b1a0b 0%,#171412 38%,#101010 100%);
  border-top:4px solid var(--red)}
.gate::before{content:'';position:absolute;right:-6vw;top:50%;width:min(40vw,440px);aspect-ratio:1;transform:translateY(-50%);pointer-events:none;z-index:-1;opacity:.36;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23f97b00' stroke-width='1.6' stroke-dasharray='6 4'/><circle cx='50' cy='50' r='27' fill='none' stroke='%23ffc08a' stroke-width='.7' opacity='.6'/><path d='M50 4v12M50 84v12M4 50h12M84 50h12M44 50h12M50 44v12' stroke='%23fff' stroke-width='1.1' fill='none'/></svg>") center/contain no-repeat}
.gate::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 72px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 72px);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 85%)}
:root[data-theme="dark"] .gate{background:
    radial-gradient(ellipse 46% 70% at 88% 115%,rgba(249,123,0,.55),rgba(249,123,0,0) 70%),
    radial-gradient(ellipse 60% 55% at 0% -10%,rgba(255,192,138,.12),rgba(255,192,138,0) 60%),
    linear-gradient(170deg,#1d1208 0%,#0f0d0b 38%,#070707 100%)}
.gate__grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:var(--space-7);align-items:end}
.gate__eyebrow{font:400 20px/24px var(--font-sans);color:#ffc08a;margin-bottom:var(--space-5)}
.gate__title{font:700 clamp(28px,4vw,46px)/1.16 var(--font-sans);color:#fff}
.gate__title span{font-weight:300;display:block}
.gate__desc{font:400 17px/26px var(--font-sans);margin-top:var(--space-5);max-width:40em;color:#e6e6e6}
.gate__meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.35)}
.gate__meta div{padding:var(--space-3) var(--space-3) var(--space-5) 0}
.gate__meta b{display:block;font:700 30px/36px var(--font-sans);color:#fff;font-variant-numeric:tabular-nums}
.gate__meta span{font:400 13px/18px var(--font-sans);color:#ccc}
.gate__foot{font:400 13px/18px var(--font-sans);margin-top:var(--space-3);color:#bbb}
.gate .sb-btn--primary{background:var(--red);border-color:var(--red);color:#fff;padding-inline:30px;box-shadow:0 0 0 0 rgba(249,123,0,.6);animation:gateBeat 2.4s ease-out infinite}
.gate .sb-btn--primary::after{content:' →'}
.gate .sb-btn--primary:hover{background:#ffa04d;border-color:#ffa04d;color:#111;animation:none}
@keyframes gateBeat{0%{box-shadow:0 0 0 0 rgba(249,123,0,.55)}60%{box-shadow:0 0 0 16px rgba(249,123,0,0)}100%{box-shadow:0 0 0 16px rgba(249,123,0,0)}}
@media (prefers-reduced-motion:reduce){.gate .sb-btn--primary{animation:none}}
.gate__eyebrow::before{content:'';display:inline-block;width:14px;height:14px;margin-right:10px;vertical-align:-1px;border:2px solid var(--red);border-radius:50%;box-shadow:inset 0 0 0 3px #2b1a0b,inset 0 0 0 5px var(--red)}
.gate__meta{border-top-color:rgba(255,192,138,.5)}
.gate__meta b{color:#ffc08a}
@media (max-width:820px){.gate__grid{grid-template-columns:1fr;gap:var(--space-6)}.gate::before{width:64vw;right:-22vw;top:30%;opacity:.22}}
/* ===== AUTO ISLAND — the game front door ===== */
body.isle-open{overflow:hidden}
body.isle-open > :not(.isle):not(.hsim):not(script):not(style):not(#acBoot){display:none!important}
.isle{--ink:#2b2420;--cream:#fff8ec;--cream2:#fff1dc;--or:#e5600c;--or2:#f97b00;--teal:#0e9fb0;--leaf:#55b14a;position:fixed;inset:0;z-index:2147482000;background:#cfe6f2;color:var(--ink);font-family:var(--font-sans);-webkit-user-select:none;user-select:none;overflow:hidden;touch-action:none}
.isle[hidden]{display:none}
.isle__view{position:absolute;inset:0}.isle__view canvas{display:block;width:100%;height:100%}
.isle button{font-family:inherit;color:inherit}
/* title */
.isle__title{position:absolute;inset:0;display:flex;align-items:center;padding:clamp(16px,4vw,64px);pointer-events:none;transition:opacity .5s,transform .5s}
.isle__title.is-out{opacity:0;transform:translateY(-18px)}
.isle__tin{pointer-events:auto;max-width:520px;background:rgba(255,248,236,.9);border:3px solid var(--ink);border-radius:30px;padding:26px 28px 22px;box-shadow:0 10px 0 rgba(43,36,32,.18),0 30px 60px rgba(120,60,40,.25);backdrop-filter:blur(6px)}
.isle__logo{display:inline-flex;align-items:center;background:var(--or2);border-radius:10px;padding:6px 10px;margin-bottom:14px}.isle__logo img{height:28px;width:auto;display:block}
.isle__kick{font:700 14px/20px var(--font-sans);color:var(--or);letter-spacing:.06em;margin:0 0 4px}
.isle__h1{font:900 clamp(40px,6.4vw,70px)/1.02 var(--font-sans);margin:0 0 12px;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word}
.isle__h1 span{background:linear-gradient(180deg,#f98b1c,#e5600c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 3px 0 rgba(43,36,32,.85))}
.isle__sub{font:500 16px/25px var(--font-sans);margin:0 0 18px;color:#4a3c33}
.isle__tact{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.isle__btn{appearance:none;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:52px;padding:10px 18px;border:3px solid var(--ink);border-radius:18px;background:#fff;cursor:pointer;text-align:left;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.isle__btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}.isle__btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.isle__btn b{font:800 16px/20px var(--font-sans)}.isle__btn small{font:500 12px/16px var(--font-sans);color:#6a5a4f}
.isle .isle__btn--go{background:linear-gradient(180deg,#ff9a3a,#e5600c);color:#fff}.isle__btn--go b,.isle__btn--go small{color:#fff}
.isle__btn--go svg{width:20px;height:20px;fill:#fff}
#isStart{flex-direction:row;align-items:center;gap:12px;font:900 22px/1 var(--font-sans);padding:14px 28px;border-radius:22px;animation:isleBeat 2s ease-in-out infinite}
@keyframes isleBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.isle__btn--ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;text-underline-offset:4px;font:600 15px/1 var(--font-sans);min-height:44px;padding:8px 6px}
.isle__btn--ghost:hover{box-shadow:none;color:var(--or)}
.isle__btn--small{min-height:44px;padding:8px 14px}
.isle__tfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:2px dashed rgba(43,36,32,.25)}
.isle__langs{display:flex;gap:4px}.isle__langs button{appearance:none;border:2px solid transparent;background:transparent;border-radius:12px;padding:6px 10px;font:600 14px/1 var(--font-sans);cursor:pointer}
.isle__langs button[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.isle__snd{font:500 13px/1 var(--font-sans);color:#7a6a5e;margin:0}
.isle__credit{font:400 11px/15px var(--font-sans);color:#8a7a6e;margin:12px 0 0}
/* HUD */
.isle__hud[hidden]{display:none}
.isle__tl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px;max-width:calc(100% - 330px);z-index:5}
.isle__chip{display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font:700 15px/20px var(--font-sans);box-shadow:0 3px 0 rgba(43,36,32,.35)}
.isle__chip span{font-weight:600;color:var(--or);font-variant-numeric:tabular-nums}
.isle__chip b{font-variant-numeric:tabular-nums}
.isle__chip--wx{gap:6px;padding:6px 12px}.isle__wxi{display:inline-flex;width:20px;height:20px;color:var(--ink)}.isle__wxi svg{width:20px;height:20px}.isle__chip--wx b{font-weight:700;white-space:nowrap}.isle__chip--wx.is-model .isle__wxi{opacity:.72}
.isle__coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd88a,#f3a023 55%,#c96d10);border:2px solid var(--ink);display:inline-block;position:relative}
.isle__coin::after{content:'A';position:absolute;inset:0;font:900 11px/16px var(--font-sans);color:#fff;text-align:center}
.isle__stampi{width:20px;height:20px;border-radius:50%;border:2px dashed var(--or);display:inline-block}
