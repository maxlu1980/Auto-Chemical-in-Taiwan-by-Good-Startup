name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save terser@5.31.0   # the same minifier as the committed build, so --check compares like with like
      - name: Build and compare with the committed site
        run: python3 build.py --check
